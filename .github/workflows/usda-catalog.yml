name: USDA catalog release

run-name: USDA catalog ${{ inputs.catalog_release }} revision ${{ inputs.catalog_revision }}

on:
  workflow_dispatch:
    inputs:
      catalog_release:
        description: USDA release date used as the immutable catalog version (YYYY-MM-DD)
        required: true
        type: string
        default: "2026-04-30"
      catalog_revision:
        description: Positive pack revision for this USDA release
        required: true
        type: string
        default: "1"
      source_url:
        description: Official FoodData Central branded-food JSON ZIP
        required: true
        type: string
        default: https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_branded_food_json_2026-04-30.zip
      source_sha256:
        description: Expected SHA-256 of the source ZIP (64 hexadecimal characters)
        required: true
        type: string
        default: "57b0f122e61cf2840f03c11e9520275d0d2018dc036e16273fcd3cd370db2256"

permissions:
  contents: read

concurrency:
  group: usda-catalog-${{ inputs.catalog_release }}-r${{ inputs.catalog_revision }}
  cancel-in-progress: false

jobs:
  build-sign:
    name: Reproducibly build and sign catalog
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'johnny9/calorie-tracker-android'
    runs-on: ubuntu-latest
    environment:
      name: continuous-signing
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.inputs.outputs.artifact_name }}
      release_tag: ${{ steps.inputs.outputs.release_tag }}
    env:
      LC_ALL: C
      TZ: UTC
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.12.12
          check-latest: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate immutable inputs
        id: inputs
        shell: bash
        env:
          INPUT_CATALOG_RELEASE: ${{ inputs.catalog_release }}
          INPUT_CATALOG_REVISION: ${{ inputs.catalog_revision }}
          INPUT_SOURCE_URL: ${{ inputs.source_url }}
          INPUT_SOURCE_SHA256: ${{ inputs.source_sha256 }}
        run: |
          if [[ ! "$INPUT_CATALOG_RELEASE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::catalog_release must use YYYY-MM-DD"
            exit 1
          fi
          # Reject normalized-but-invalid dates such as 2026-02-31.
          test "$(date -u -d "$INPUT_CATALOG_RELEASE" +%F)" = "$INPUT_CATALOG_RELEASE"

          if [[ ! "$INPUT_CATALOG_REVISION" =~ ^[1-9][0-9]{0,17}$ ]]; then
            echo "::error::catalog_revision must be a positive integer with at most 18 digits"
            exit 1
          fi

          expected_source_url="https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_branded_food_json_${INPUT_CATALOG_RELEASE}.zip"
          if [ "$INPUT_SOURCE_URL" != "$expected_source_url" ]; then
            echo "::error::source_url must exactly match the branded-food JSON archive for catalog_release: $expected_source_url"
            exit 1
          fi

          source_sha256="$(printf '%s' "$INPUT_SOURCE_SHA256" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$source_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::source_sha256 must contain exactly 64 hexadecimal characters"
            exit 1
          fi

          release_tag="usda-catalog-v${INPUT_CATALOG_RELEASE}-r${INPUT_CATALOG_REVISION}"
          artifact_name="usda-catalog-${INPUT_CATALOG_RELEASE}-r${INPUT_CATALOG_REVISION}-${GITHUB_SHA}"
          source_zip="$RUNNER_TEMP/usda-source/source.zip"
          source_date_epoch="$(date -u -d "$INPUT_CATALOG_RELEASE" +%s)"

          echo "CATALOG_RELEASE=$INPUT_CATALOG_RELEASE" >> "$GITHUB_ENV"
          echo "CATALOG_REVISION=$INPUT_CATALOG_REVISION" >> "$GITHUB_ENV"
          echo "SOURCE_URL=$INPUT_SOURCE_URL" >> "$GITHUB_ENV"
          echo "SOURCE_SHA256=$source_sha256" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP=$source_zip" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$source_date_epoch" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "source_sha256=$source_sha256" >> "$GITHUB_OUTPUT"

      - name: Restore verified USDA source cache
        id: source-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/usda-source/source.zip
          key: usda-source-${{ inputs.catalog_release }}-${{ steps.inputs.outputs.source_sha256 }}

      - name: Download USDA source on cache miss
        if: steps.source-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          install -d -m 700 "$(dirname "$SOURCE_ZIP")"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 4 --retry-all-errors --output "$SOURCE_ZIP" "$SOURCE_URL"

      - name: Verify USDA source checksum
        shell: bash
        run: |
          test -f "$SOURCE_ZIP"
          printf '%s  %s\n' "$SOURCE_SHA256" "$SOURCE_ZIP" | sha256sum --check --strict -

      - name: Build twice and compare generator outputs
        shell: bash
        run: |
          test -f tools/usda-pack/build_catalog.py
          install -d dist/build-a dist/build-b
          python3 tools/usda-pack/build_catalog.py \
            --input "$SOURCE_ZIP" \
            --output dist/build-a/usda-catalog.sqlite \
            --manifest dist/build-a/usda-catalog-manifest.json \
            --release "$CATALOG_RELEASE" \
            --source-url "$SOURCE_URL"
          python3 tools/usda-pack/build_catalog.py \
            --input "$SOURCE_ZIP" \
            --output dist/build-b/usda-catalog.sqlite \
            --manifest dist/build-b/usda-catalog-manifest.json \
            --release "$CATALOG_RELEASE" \
            --source-url "$SOURCE_URL"

          cmp dist/build-a/usda-catalog.sqlite dist/build-b/usda-catalog.sqlite
          cmp dist/build-a/usda-catalog-manifest.json dist/build-b/usda-catalog-manifest.json
          python3 -m json.tool dist/build-a/usda-catalog-manifest.json >/dev/null
          python3 - <<'PY'
          import json
          import os
          import sqlite3

          path = "dist/build-a/usda-catalog.sqlite"
          manifest_path = "dist/build-a/usda-catalog-manifest.json"
          max_database_bytes = 1_500_000_000
          max_record_bytes = 16 * 1_024 * 1_024
          max_block_bytes = max_record_bytes

          with open(manifest_path, encoding="utf-8") as source:
              manifest = json.load(source)

          def required_nonnegative_integer(name: str) -> int:
              value = manifest.get(name)
              if not isinstance(value, int) or isinstance(value, bool) or value < 0:
                  raise SystemExit(f"Catalog manifest {name} is not a nonnegative integer: {value!r}")
              return value

          manifest_database_bytes = required_nonnegative_integer("database_size_bytes")
          manifest_record_bytes = required_nonnegative_integer("largest_record_bytes")
          manifest_block_bytes = required_nonnegative_integer("largest_block_bytes")
          actual_database_bytes = os.path.getsize(path)
          with sqlite3.connect(f"file:{path}?mode=ro", uri=True) as database:
              result = database.execute("PRAGMA integrity_check").fetchall()
              actual_record_bytes = database.execute(
                  "SELECT COALESCE(MAX(record_length), 0) FROM catalog_food"
              ).fetchone()[0]
              actual_block_bytes = database.execute(
                  "SELECT COALESCE(MAX(uncompressed_size), 0) FROM catalog_payload_block"
              ).fetchone()[0]
          if result != [("ok",)]:
              raise SystemExit(f"SQLite integrity_check failed: {result!r}")
          measured = {
              "database_size_bytes": actual_database_bytes,
              "largest_record_bytes": actual_record_bytes,
              "largest_block_bytes": actual_block_bytes,
          }
          declared = {
              "database_size_bytes": manifest_database_bytes,
              "largest_record_bytes": manifest_record_bytes,
              "largest_block_bytes": manifest_block_bytes,
          }
          if declared != measured:
              raise SystemExit(f"Catalog manifest size measurements differ from SQLite: {declared!r} != {measured!r}")
          limits = {
              "database_size_bytes": max_database_bytes,
              "largest_record_bytes": max_record_bytes,
              "largest_block_bytes": max_block_bytes,
          }
          exceeded = {
              name: (declared[name], limit)
              for name, limit in limits.items()
              if declared[name] > limit
          }
          if exceeded:
              raise SystemExit(f"Catalog exceeds Android reader limits: {exceeded!r}")
          PY

      - name: Build deterministic unsigned catalog JAR
        id: package
        shell: bash
        run: |
          sqlite_sha256="$(sha256sum dist/build-a/usda-catalog.sqlite | cut -d ' ' -f 1)"
          test "$(jq -r .database_entry dist/build-a/usda-catalog-manifest.json)" = \
            "usda-catalog.sqlite"
          test "$(jq -r .database_sha256 dist/build-a/usda-catalog-manifest.json)" = \
            "$sqlite_sha256"
          test "$(jq -r .schema_version dist/build-a/usda-catalog-manifest.json)" = "1"
          test "$(jq -r .release_date dist/build-a/usda-catalog-manifest.json)" = \
            "$CATALOG_RELEASE"

          for build in a b; do
            package_dir="dist/package-$build"
            install -d "$package_dir/META-INF"
            install -m 644 "dist/build-$build/usda-catalog.sqlite" \
              "$package_dir/usda-catalog.sqlite"
            install -m 644 "dist/build-$build/usda-catalog-manifest.json" \
              "$package_dir/usda-catalog-manifest.json"
            (
              cd "$package_dir"
              sha256sum usda-catalog.sqlite usda-catalog-manifest.json > SHA256SUMS
            )

            # JAR manifest physical lines are limited to 72 bytes including
            # CRLF. Continue the 64-byte digest after 53 bytes so Java's
            # Manifest parser reconstructs the complete attribute value.
            printf 'Manifest-Version: 1.0\r\nCatalog-Schema-Version: 1\r\nCatalog-Release: %s\r\nCatalog-Revision: %s\r\nCatalog-SHA-256: %s\r\n %s\r\n\r\n' \
              "$CATALOG_RELEASE" "$CATALOG_REVISION" \
              "${sqlite_sha256:0:53}" "${sqlite_sha256:53}" \
              > "$package_dir/META-INF/MANIFEST.MF"

            touch --date="@$SOURCE_DATE_EPOCH" \
              "$package_dir/META-INF/MANIFEST.MF" \
              "$package_dir/usda-catalog.sqlite" \
              "$package_dir/usda-catalog-manifest.json" \
              "$package_dir/SHA256SUMS"
            (
              cd "$package_dir"
              zip -X -q -9 "../usda-catalog-pack-$build.jar" \
                META-INF/MANIFEST.MF \
                usda-catalog.sqlite \
                usda-catalog-manifest.json \
                SHA256SUMS
            )
          done

          cmp dist/usda-catalog-pack-a.jar dist/usda-catalog-pack-b.jar
          install -d dist/release
          install -m 644 dist/usda-catalog-pack-a.jar dist/release/usda-catalog-pack.jar
          echo "sqlite_sha256=$sqlite_sha256" >> "$GITHUB_OUTPUT"
          echo "unsigned_jar_sha256=$(sha256sum dist/usda-catalog-pack-a.jar | cut -d ' ' -f 1)" \
            >> "$GITHUB_OUTPUT"

      - name: Restore permanent Android signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          install -d -m 700 "$RUNNER_TEMP/android-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/android-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/android-signing/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-signing/release.jks" >> "$GITHUB_ENV"

      - name: Sign and verify catalog JAR
        shell: bash
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          catalog_jar="dist/release/usda-catalog-pack.jar"
          jarsigner \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_STORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            -digestalg SHA-256 \
            -sigalg SHA256withRSA \
            -sigfile CATALOG \
            "$catalog_jar" "$ANDROID_KEY_ALIAS"

          verify_report="$(jarsigner -verify -verbose -certs "$catalog_jar" 2>&1)"
          printf '%s\n' "$verify_report"
          grep -Fq 'jar verified.' <<< "$verify_report"

          certificate_report="$(keytool -printcert -jarfile "$catalog_jar")"
          printf '%s\n' "$certificate_report"
          actual="$(printf '%s\n' "$certificate_report" | sed -nE '/SHA256:/ { s/.*SHA256:[[:space:]]*//; p; q; }' | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          expected="$(tr '[:lower:]' '[:upper:]' < signing-cert-sha256.txt | tr -d ':[:space:]')"
          [[ "$actual" =~ ^[0-9A-F]{64}$ ]]
          [[ "$expected" =~ ^[0-9A-F]{64}$ ]]
          test "$actual" = "$expected"

          for entry in \
            META-INF/MANIFEST.MF \
            usda-catalog.sqlite \
            usda-catalog-manifest.json \
            SHA256SUMS; do
            count="$(zipinfo -1 "$catalog_jar" | grep -Fxc "$entry" || true)"
            test "$count" = "1"
          done

          install -d "$RUNNER_TEMP/catalog-contents"
          unzip -q "$catalog_jar" \
            usda-catalog.sqlite usda-catalog-manifest.json SHA256SUMS \
            -d "$RUNNER_TEMP/catalog-contents"
          (
            cd "$RUNNER_TEMP/catalog-contents"
            sha256sum --check --strict SHA256SUMS
          )
          embedded_sqlite_sha256="$(sha256sum "$RUNNER_TEMP/catalog-contents/usda-catalog.sqlite" | cut -d ' ' -f 1)"
          test "$embedded_sqlite_sha256" = "${{ steps.package.outputs.sqlite_sha256 }}"
          python3 - \
            "$catalog_jar" \
            "$embedded_sqlite_sha256" \
            "$CATALOG_RELEASE" \
            "$CATALOG_REVISION" <<'PY'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              physical_lines = archive.read("META-INF/MANIFEST.MF").splitlines()
          attributes: dict[str, str] = {}
          current: str | None = None
          for physical_line in physical_lines:
              line = physical_line.decode("utf-8")
              if line.startswith(" "):
                  if current is None:
                      raise SystemExit("JAR manifest starts with an invalid continuation")
                  attributes[current] += line[1:]
              elif ": " in line:
                  current, value = line.split(": ", 1)
                  attributes[current] = value
              elif line:
                  raise SystemExit(f"Invalid JAR manifest line: {line!r}")
          if attributes.get("Catalog-Schema-Version") != "1":
              raise SystemExit("Catalog-Schema-Version is not 1")
          if attributes.get("Catalog-SHA-256") != sys.argv[2]:
              raise SystemExit("Catalog-SHA-256 does not match the embedded database")
          if attributes.get("Catalog-Release") != sys.argv[3]:
              raise SystemExit("Catalog-Release does not match the requested release")
          if attributes.get("Catalog-Revision") != sys.argv[4]:
              raise SystemExit("Catalog-Revision does not match the requested revision")
          PY

      - name: Stage signed release files
        shell: bash
        run: |
          (
            cd dist/release
            sha256sum usda-catalog-pack.jar > usda-catalog-pack.jar.sha256
          )
          python_version="$(python3 --version 2>&1)"
          sqlite_version="$(python3 -c 'import sqlite3; print(sqlite3.sqlite_version)')"
          zlib_version="$(python3 -c 'import zlib; print(zlib.ZLIB_RUNTIME_VERSION)')"
          printf '%s\n' \
            "catalogRelease=$CATALOG_RELEASE" \
            "catalogRevision=$CATALOG_REVISION" \
            "releaseTag=$RELEASE_TAG" \
            "sourceUrl=$SOURCE_URL" \
            "sourceSha256=$SOURCE_SHA256" \
            "catalogSqliteSha256=${{ steps.package.outputs.sqlite_sha256 }}" \
            "unsignedJarSha256=${{ steps.package.outputs.unsigned_jar_sha256 }}" \
            "signedJarSha256=$(sha256sum dist/release/usda-catalog-pack.jar | cut -d ' ' -f 1)" \
            "generatorCommit=$GITHUB_SHA" \
            "python=$python_version" \
            "sqlite=$sqlite_version" \
            "zlib=$zlib_version" \
            > dist/release/USDA_CATALOG_BUILD_INFO.txt

      - name: Upload immutable catalog candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.inputs.outputs.artifact_name }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Remove restored key
        if: always()
        run: rm -f "$RUNNER_TEMP/android-signing/release.jks"

  publish:
    name: Publish immutable catalog release
    needs: build-sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LC_ALL: C
      RELEASE_TAG: ${{ needs.build-sign.outputs.release_tag }}
    steps:
      - name: Check out expected signing certificate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Download signed catalog candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-sign.outputs.artifact_name }}
          path: release

      - name: Verify candidate before publishing
        shell: bash
        run: |
          test -f release/usda-catalog-pack.jar
          test -f release/usda-catalog-pack.jar.sha256
          test -f release/USDA_CATALOG_BUILD_INFO.txt
          (
            cd release
            sha256sum --check --strict usda-catalog-pack.jar.sha256
          )

          verify_report="$(jarsigner -verify -verbose -certs release/usda-catalog-pack.jar 2>&1)"
          printf '%s\n' "$verify_report"
          grep -Fq 'jar verified.' <<< "$verify_report"
          certificate_report="$(keytool -printcert -jarfile release/usda-catalog-pack.jar)"
          actual="$(printf '%s\n' "$certificate_report" | sed -nE '/SHA256:/ { s/.*SHA256:[[:space:]]*//; p; q; }' | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          expected="$(tr '[:lower:]' '[:upper:]' < signing-cert-sha256.txt | tr -d ':[:space:]')"
          [[ "$actual" =~ ^[0-9A-F]{64}$ ]]
          [[ "$expected" =~ ^[0-9A-F]{64}$ ]]
          test "$actual" = "$expected"

          if [[ ! "$RELEASE_TAG" =~ ^usda-catalog-v([0-9]{4}-[0-9]{2}-[0-9]{2})-r([1-9][0-9]{0,17})$ ]]; then
            echo "::error::Unexpected catalog release tag $RELEASE_TAG"
            exit 1
          fi
          python3 - \
            release/usda-catalog-pack.jar \
            "${BASH_REMATCH[1]}" \
            "${BASH_REMATCH[2]}" <<'PY'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              physical_lines = archive.read("META-INF/MANIFEST.MF").splitlines()
          attributes: dict[str, str] = {}
          current: str | None = None
          for physical_line in physical_lines:
              line = physical_line.decode("utf-8")
              if line.startswith(" "):
                  if current is None:
                      raise SystemExit("JAR manifest starts with an invalid continuation")
                  attributes[current] += line[1:]
              elif ": " in line:
                  current, value = line.split(": ", 1)
                  attributes[current] = value
              elif line:
                  raise SystemExit(f"Invalid JAR manifest line: {line!r}")
          if attributes.get("Catalog-Release") != sys.argv[2]:
              raise SystemExit("Catalog-Release does not match the release tag")
          if attributes.get("Catalog-Revision") != sys.argv[3]:
              raise SystemExit("Catalog-Revision does not match the release tag")
          PY

      - name: Publish versioned catalog assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; catalog releases are immutable"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists without the expected release"
            exit 1
          fi

          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "USDA catalog ${RELEASE_TAG#usda-catalog-v}" \
            --notes-file release/USDA_CATALOG_BUILD_INFO.txt \
            --latest=false \
            release/usda-catalog-pack.jar \
            release/usda-catalog-pack.jar.sha256 \
            release/USDA_CATALOG_BUILD_INFO.txt
